name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The deep link scheme is written down in four places that nothing else
      # makes agree, and when they disagreed the only symptom was an installed
      # release ignoring invite links. Not something any other check would see.
      - name: Deep link scheme
        run: node apps/chat/scripts/check-scheme.mjs

      # A misspelled design token is not a CSS error. The declaration is dropped
      # and the element keeps whatever it had, so a control silently loses its
      # background or its focus ring while every other check stays green. Five
      # names were dead across ten declarations before this existed.
      - name: Design tokens resolve
        run: node apps/chat/scripts/check-tokens.mjs

      # tokens.css is generated from @lcai-p2p/ui and was the one generator
      # without a check. A hand edit there produces no error and no symptom: the
      # value resolves, the interface uses it, every other check stays green,
      # and the change disappears the next time anybody builds.
      - name: Design tokens are current
        run: node apps/chat/scripts/build-tokens.mjs --check

      # The sprite is generated from lucide-static. This fails if it was edited
      # by hand or if the map changed without regenerating.
      - name: Icon sprite is current
        run: node apps/chat/scripts/build-icons.mjs --check

      # The asset marks are compiled into the same sprite from a CC0 set,
      # because the renderer's policy allows no network origin for images and
      # loading logos from a CDN would mean relaxing that for decoration.
      - name: Coin marks are current
        run: node apps/chat/scripts/build-coins.mjs --check

      # index.html is assembled from renderer/partials. Editing it directly
      # works until the next build, which is the worst kind of works.
      - name: Markup is current
        run: node apps/chat/scripts/build-markup.mjs --check

      # One accent per screen. The mark's own colours are more saturated than
      # anything the interface should put behind text, and no contrast test
      # objects to using them anyway — the primary button was a violet-to-magenta
      # gradient and passed everything.
      - name: One accent per surface
        run: node apps/chat/scripts/check-accent.mjs

      # Surface sheets load after the kit, so a surface that redeclares a shared
      # class replaces that component everywhere rather than styling its own
      # copy. Three of those were found in one evening, none of them visible in
      # the panel that caused it.
      - name: Surfaces do not redeclare kit components
        run: node apps/chat/scripts/check-kit.mjs

      # Renames leave the old rule behind, still valid and matching nothing, so
      # the next person to style that surface finds two plausible rules and no
      # way to tell which is live. Four had accumulated.
      - name: No styled class goes unworn
        run: node apps/chat/scripts/check-css.mjs

      # A pear:// link is an update channel rather than a name. Both apps
      # carried the same one, which meant staging either would have pushed it
      # to the other's installs. Nothing else would have caught that: both
      # build, both boot, and the damage only shows on somebody else's machine.
      - name: Apps have distinct upgrade links
        run: node scripts/check-links.mjs

      # pnpm satisfies two disagreeing ranges by nesting, so one package on an
      # older major quietly loads a second copy of the whole network stack into
      # the same worker. That is usually waste. For bare-tls it was not: it did
      # not verify certificates before 3.0.0, and the package pinned to 1.x was
      # the one carrying prompts to the inference service. Both versions
      # install, both resolve, both work, and the difference is a security
      # property with no symptom.
      - name: Bare runtimes agree on a major
        run: node scripts/check-runtime-majors.mjs

      # Three surveys that ask the chains whether this repository still
      # describes them. None of them signs anything or costs anything.
      #
      # They exist because every constant they check is one that fails quietly.
      # A wrong token address reads as a zero balance, so the asset simply never
      # appears. A stale `decimals` shows a balance wrong by a factor of a
      # million, and applies that factor to anything typed into a send field. A
      # bridge router that has moved accepts a transfer and keeps it. None of
      # that raises an error anywhere, and none of it can be caught by reading
      # the file — only by asking.
      #
      # `continue-on-error`, because they depend on public endpoints that go
      # down. A red run here means "go and look", not "the branch is broken".
      - name: Chains are as the registry describes
        continue-on-error: true
        run: node packages/chain/scripts/survey-chains.mjs

      - name: Tokens are as the list describes
        continue-on-error: true
        run: node packages/chain/scripts/survey-tokens.mjs

      - name: The bridge is where it was
        continue-on-error: true
        run: node packages/chain/scripts/survey-bridge.mjs

      # Price feeds are read straight from Ethereum, so this catches an
      # aggregator being retired or its answer changing shape. The sanity checks
      # inside it — a stablecoin near a dollar, BTC above ETH — are what catch a
      # decoding error that still produces a plausible number.
      - name: Prices resemble reality
        continue-on-error: true
        run: node packages/prices/scripts/survey-prices.mjs

  # The end-to-end harnesses, which until now only ever ran on somebody's own
  # machine. Everything they cover — the onboarding flow, message text becoming
  # markup, drafts, pinning, dropping a file, duplicate ids, focus order — was
  # unprotected by CI, so a renderer regression passed on green.
  #
  # A separate job because it is slower and because Electron needs a display.
  harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # 22 rather than the 20 the job above uses. These harnesses talk to the
      # window over the DevTools protocol with a global `WebSocket`, which
      # arrived in Node 22 — the check job stays on 20 deliberately, because
      # that is the version `engines` declares and something should prove it.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Electron will not start without one, and these drive a real window.
      - name: Install a display and Electron's libraries
        run: |
          sudo apt-get update
          # xvfb is the one that must land. The rest are usually already on the
          # runner, and the audio library was renamed between Ubuntu releases,
          # so they are installed individually and allowed to be absent rather
          # than failing the job over a package name.
          # xclip is not optional either: the clipboard harness reads the
          # selection back from outside the application, and refuses to run
          # without a reader rather than passing on assertions it cannot make.
          sudo apt-get install -y xvfb xclip
          for lib in libgtk-3-0 libgtk-3-0t64 libnss3 libasound2 libasound2t64; do
            sudo apt-get install -y "$lib" || true
          done

      # Electron refuses to start rather than run unsandboxed, and the helper
      # arrives from npm without the ownership it needs. `--no-sandbox` is the
      # usual answer and is the wrong one here: this job includes the suite that
      # asks what a hostile renderer can reach, and running it in a
      # configuration no user has would be testing something else.
      - name: Let Electron keep its sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # Everything that needs nothing but this machine and a network.
      #
      # `surfaces-check` and `inference-check` stay out: they read balances and
      # model fees from a live chain, and a suite that fails when a testnet is
      # slow is a suite nobody trusts.
      #
      # The wallet harnesses are in, and they do reach real chains — but only to
      # read. None of them signs anything, because every check worth making
      # about a transfer is on the near side of the signature. What they would
      # catch is a token address drifting, a decoder breaking, or a refusal
      # quietly stopping refusing.
      - name: Drive the application
        working-directory: apps/chat
        run: |
          set -e
          rm -rf /tmp/ci-chat
          xvfb-run --auto-servernum \
            pnpm exec electron . --no-updates --remote-debugging-port=9222 --storage /tmp/ci-chat &
          echo $! > /tmp/app.pid

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9222/json/list > /dev/null; then break; fi
            sleep 3
          done
          curl -sf http://127.0.0.1:9222/json/list > /dev/null || { echo 'the window never came up'; exit 1; }

          for harness in onboarding-check hostile-renderer conversation-check transcript-search \
                         clipboard-check locking-check assets-check send-check \
                         asset-page-check bridge-check; do
            echo "--- $harness"
            node "scripts/$harness.mjs" 9222
          done
          node scripts/review.mjs 9222 /tmp/ci-shots

      - name: Stop the application
        if: always()
        run: kill "$(cat /tmp/app.pid)" 2>/dev/null || true

      # A picture of every surface in both themes, which is the only way to see
      # a layout regression in a pull request.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surfaces
          path: /tmp/ci-shots
          if-no-files-found: ignore
