name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The deep link scheme is written down in four places that nothing else
      # makes agree, and when they disagreed the only symptom was an installed
      # release ignoring invite links. Not something any other check would see.
      - name: Deep link scheme
        run: node apps/chat/scripts/check-scheme.mjs

      # A misspelled design token is not a CSS error. The declaration is dropped
      # and the element keeps whatever it had, so a control silently loses its
      # background or its focus ring while every other check stays green. Five
      # names were dead across ten declarations before this existed.
      - name: Design tokens resolve
        run: node apps/chat/scripts/check-tokens.mjs

      # The sprite is generated from lucide-static. This fails if it was edited
      # by hand or if the map changed without regenerating.
      - name: Icon sprite is current
        run: node apps/chat/scripts/build-icons.mjs --check
