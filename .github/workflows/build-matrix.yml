name: build-matrix

# Native runners per platform. Signing invokes platform tooling (codesign on
# Apple, MSIX packaging on Windows), so cross-compiling a release artifact is
# not viable — each target builds on its own OS.
#
# Signature verification is blocking: after every package step, the produced
# binary or installer is checked with the platform's own tooling, and an
# unsigned or mis-signed artifact fails the build. Signing secrets live in the
# repository settings; see docs/signing-procurement.md.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  # Announced before anything is built. Every signing step below skips itself
  # when its secret is absent, which is right — but it means an unsigned
  # artifact is indistinguishable from a signed one until somebody downloads it.
  signing:
    name: what this build will sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          WINDOWS_CERT_SHA1: ${{ secrets.WINDOWS_CERT_SHA1 }}
          WINDOWS_SIGN_HOOK: ${{ secrets.WINDOWS_SIGN_HOOK }}
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
        run: node scripts/check-signing.mjs

  build:
    name: ${{ matrix.app.name }} ${{ matrix.target.host }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      # Two independent dimensions, so this is a genuine cross product: every
      # app on every target. `include` would extend combinations rather than
      # multiply them, which silently produces jobs with no runner.
      matrix:
        app:
          - { name: supervisor, binary: lcai-supervisor }
          - { name: seeder, binary: lcai-seeder }
        target:
          - { runner: ubuntu-latest, host: linux-x64 }
          - { runner: ubuntu-24.04-arm, host: linux-arm64 }
          - { runner: macos-latest, host: darwin-arm64 }
          - { runner: macos-15-intel, host: darwin-x64 }
          - { runner: windows-latest, host: win32-x64 }
          - { runner: windows-11-arm, host: win32-arm64 }

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Workspace packages must be compiled before an app can import them.
      - name: Build packages
        run: pnpm build

      # Must run from the repository root. bare-build resolves modules against
      # its base directory, and in a monorepo the dependencies are in the root
      # node_modules. Building from the app directory yields a binary that
      # compiles and then crashes on startup. scripts/make.mjs enforces this.
      - name: Build standalone binary
        run: node scripts/make.mjs ${{ matrix.app.name }} ${{ matrix.target.host }}

      # Signs only when a certificate thumbprint is configured, so the workflow
      # is identical before and after one exists. Verified locally against a
      # self-signed certificate: the embedded bundle survives Authenticode and
      # the binary still runs. See docs/decisions/0003-windows-signing.md.
      #
      # Azure Artifact Signing needs a different step — it issues short-lived
      # certificates and signs through a dlib rather than a thumbprint.
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_SHA1 != ''
        env:
          WINDOWS_CERT_SHA1: ${{ secrets.WINDOWS_CERT_SHA1 }}
        run: node scripts/sign-windows.mjs apps/${{ matrix.app.name }}/out/${{ matrix.target.host }}/${{ matrix.app.binary }}.exe

      # bare-build signs and cannot notarize, so without this Gatekeeper blocks
      # the binary on every Mac that did not build it — reporting the file as
      # damaged, which sends people looking in the wrong place. Skips itself
      # when no credentials are configured, so the workflow is the same before
      # and after they exist.
      - name: Notarize (macOS)
        if: runner.os == 'macOS'
        env:
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: node scripts/notarize-macos.mjs apps/${{ matrix.app.name }}/out/${{ matrix.target.host }}/${{ matrix.app.binary }}

      # The gate. The signing steps above skip silently when their secrets are
      # absent, so "no error" never meant "signed" — this checks the produced
      # binary itself, with the platform's own tooling: signtool on Windows,
      # codesign (rejecting ad-hoc signatures) on macOS. Linux has no
      # signature scheme in this pipeline, so there it checks existence only.
      # Deliberately after signing and notarization, which rewrite the file.
      - name: Verify signature
        shell: bash
        run: |
          bin="apps/${{ matrix.app.name }}/out/${{ matrix.target.host }}/${{ matrix.app.binary }}"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          node scripts/check-signing.mjs --require "$bin"

      # Every runner is native to the target it builds, so all of them can
      # execute what they produce. An artifact that compiles but has never been
      # run is not evidence of anything. Deliberately after signing, because
      # signing rewrites the file.
      - name: Smoke test the binary
        shell: bash
        run: |
          bin="apps/${{ matrix.app.name }}/out/${{ matrix.target.host }}/${{ matrix.app.binary }}"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          chmod +x "$bin" 2>/dev/null || true
          "$bin" --version

      # `always`: a failed verify gate is exactly when the artifacts matter —
      # an unsigned build is something to inspect, not something to lose. The
      # job still goes red; the release workflow's own gates decide what ships.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app.name }}-${{ matrix.target.host }}
          path: apps/${{ matrix.app.name }}/out/${{ matrix.target.host }}
          if-no-files-found: error

  desktop:
    # The application people actually install, which the binary matrix above
    # does not cover: it is Electron, packaged by Forge into a DMG, an MSIX and
    # an AppImage rather than a standalone Bare binary.
    #
    # Three targets rather than six. Forge builds for the architecture it runs
    # on, and the arm64 runners are not needed until there is demand for them.
    name: desktop ${{ matrix.target.host }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { runner: ubuntu-latest, host: linux-x64 }
          - { runner: macos-latest, host: darwin-arm64 }
          - { runner: windows-latest, host: win32-x64 }

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Signing is by presence of the secrets, matching the binary matrix.
      # MAC_CODESIGN_IDENTITY and WINDOWS_SIGN_HOOK are read by forge.config.js;
      # unset, it packages unsigned rather than failing.
      - name: Package installers
        working-directory: apps/chat
        env:
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          KEYCHAIN_PROFILE: ${{ secrets.NOTARY_PROFILE }}
          WINDOWS_SIGN_HOOK: ${{ secrets.WINDOWS_SIGN_HOOK }}
        run: pnpm make

      # The same gate for the installers people actually download. The MSIX is
      # signed through WINDOWS_SIGN_HOOK inside `pnpm make`, the app inside the
      # DMG through MAC_CODESIGN_IDENTITY — this step trusts neither claim and
      # checks the artifact. An unsigned DMG passes only when the .app inside
      # it is signed and notarized, which is what Gatekeeper evaluates. The
      # patterns are quoted so check-signing.mjs expands the globs itself and
      # the step is identical on every shell.
      - name: Verify installer signatures
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) node scripts/check-signing.mjs --require "apps/chat/out/make/**/*.msix" ;;
            macOS)   node scripts/check-signing.mjs --require "apps/chat/out/make/**/*.dmg" ;;
            *)       node scripts/check-signing.mjs --require "apps/chat/out/make" ;;
          esac

      # `always` here for the same reason as the binary matrix above: the
      # unsigned-installer gate should cost the build its green checkmark, not
      # the artifacts somebody needs to look at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.target.host }}
          path: apps/chat/out/make
          if-no-files-found: error

  assemble:
    # Collects every platform artifact into the by-arch layout that pear stage
    # expects. Staging and seeding are deliberately manual until the release
    # multisig policy is agreed.
    name: assemble deployment
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List artifacts
        run: find ./artifacts -type f | sort
