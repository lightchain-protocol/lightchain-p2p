packages:
  - 'apps/*'
  - 'packages/*'

# Native modules in this stack compile on install. Allow them explicitly rather
# than globally, so a new native dependency is a deliberate decision.
onlyBuiltDependencies:
  - sodium-native
  - rocksdb-native
  # Electron's postinstall downloads the runtime binary. Without it the chat app
  # installs "successfully" and then cannot start.
  - electron
