    <dialog class="dialog" id="secure-dialog">
      <div class="dialog-form">
        <h2 class="dialog-title">How this room is protected</h2>
        <dl class="facts" id="secure-facts"></dl>
        <p class="dialog-note">
          The encryption key never travels with the room key. A blind peer can hold this room and
          keep it available without being able to read a word of it.
        </p>
        <div class="dialog-actions">
          <button class="button button-primary" type="button" data-close="secure-dialog">
            Close
          </button>
        </div>
      </div>
    </dialog>
