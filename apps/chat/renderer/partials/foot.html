
    <!-- One dialog for both directions. Two forms that differ by which endpoint
         they call is two places to fix the amount parsing. -->
    <dialog aria-labelledby="move-title" class="dialog" id="move-dialog">
      <form method="dialog" class="dialog-form" id="move-form">
        <h2 class="dialog-title" id="move-title">Deposit</h2>
        <p class="dialog-body" id="move-body"></p>
        <label class="field">
          <span class="field-label">Amount in LCAI</span>
          <input
            class="input"
            id="move-amount"
            type="text"
            inputmode="decimal"
            placeholder="0.1"
            autocomplete="off"
          />
        </label>
        <p class="dialog-note" id="move-available"></p>
        <p class="dialog-error" id="move-error" hidden></p>
        <div class="dialog-actions">
          <button class="button" type="button" data-close="move-dialog">Cancel</button>
          <button class="button button-primary" type="submit" id="move-submit">Deposit</button>
        </div>
      </form>
    </dialog>

    <!-- `popover="manual"` rather than an ordinary fixed element: an open
         dialog lives in the top layer, above everything in the document, so a
         toast that is not itself in the top layer renders *behind* it and a
         "copied" confirmation made from inside a dialog is never seen. -->
    <p class="toast" id="toast" hidden popover="manual"></p>

    <script type="module" src="./lib/main.js"></script>
  </body>
</html>
