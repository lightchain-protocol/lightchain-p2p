
    <!-- Drawn by us on Windows and Linux; on macOS the traffic lights sit here
         and the content is inset to clear them. -->
    <header class="titlebar" id="titlebar">
      <div class="titlebar-brand">
        <svg class="logo" aria-hidden="true"><use href="#i-logo" /></svg>
        <span class="wordmark">Lightchain</span>
      </div>
      <!-- The only control the bar ever carries, and it is hidden until there
           is something to apply. renderer/lib/ipc.js resolves it by id. -->
      <button
        class="button button-primary button-sm titlebar-update"
        type="button"
        id="update-btn"
        hidden
      >
        Apply update
      </button>
    </header>
