
    <!-- Drawn by us on Windows and Linux; on macOS the traffic lights sit here
         and the content is inset to clear them. -->
    <header class="titlebar" id="titlebar">
      <svg class="logo" aria-hidden="true"><use href="#i-logo" /></svg>
      <span class="wordmark">Lightchain</span>
      <button
        class="titlebar-balance"
        type="button"
        id="titlebar-balance"
        title="Your wallet"
        hidden
      ></button>
      <span class="titlebar-status" id="status">starting</span>
      <button class="button button-primary button-sm" id="update-btn" hidden>Apply update</button>
      <button class="icon-button" type="button" id="theme-btn" title="Theme" aria-label="Theme">
        <svg class="icon" aria-hidden="true"><use href="#i-sun" /></svg>
      </button>
      <button
        class="icon-button"
        type="button"
        id="settings-btn"
        title="Settings"
        aria-label="Settings"
      >
        <svg class="icon" aria-hidden="true"><use href="#i-settings" /></svg>
      </button>
    </header>
