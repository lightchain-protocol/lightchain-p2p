    <!-- Swapping -----------------------------------------------------------
         What this wallet holds on Ethereum into LCAI, over Uniswap v3, without
         leaving the app. Same two-step discipline as Send: the quote is read
         live from the chain (QuoterV2 over eth_call — no API key, nothing told
         to anyone), and the confirm button only appears over figures the
         worker produced. Approving stays its own visible transaction, as on
         the bridge, because the allowance is the part worth seeing.

         The destination is fixed — LCAI on Ethereum — so it is stated rather
         than picked: the only choice a swap screen could offer here is the one
         that buys the wrong token. The route strip under the title says the
         direction in marks rather than words: ether in, LCAI out, Uniswap
         doing the trade. -->
    <dialog class="dialog" id="swap-dialog">
      <form method="dialog" class="dialog-form" id="swap-form">
        <div class="dialog-head">
          <h2 class="dialog-title">Swap into LCAI</h2>
          <button
            class="dialog-close"
            type="button"
            data-close="swap-dialog"
            aria-label="Close"
            title="Close"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
          </button>
        </div>

        <!-- The direction and the venue, in marks: ether in, LCAI out, the
             unicorn doing the trade. -->
        <div class="swap-route" aria-hidden="true">
          <svg class="swap-mark"><use href="#c-eth" /></svg>
          <svg class="icon swap-route-arrow"><use href="#i-receive" /></svg>
          <svg class="swap-mark swap-mark-lcai"><use href="#i-logo" /></svg>
          <span class="swap-provider">
            <svg class="swap-provider-mark"><use href="#c-uniswap" /></svg>
            Uniswap v3
          </span>
        </div>

        <div class="alert" data-tone="warn" role="alert" id="swap-unavailable" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-alert" /></svg>
          <div class="alert-body">
            <strong class="alert-title">Swapping needs Ethereum</strong>
            <span data-slot="detail"></span>
          </div>
        </div>

        <label class="field">
          <span class="field-label">From</span>
          <select class="input" id="swap-from"></select>
        </label>

        <label class="field">
          <span class="field-label">Amount</span>
          <span class="field-with-button">
            <input
              class="input"
              id="swap-amount"
              type="text"
              inputmode="decimal"
              spellcheck="false"
              autocomplete="off"
              placeholder="0.0"
            />
            <button class="field-reveal" type="button" id="swap-max">Max</button>
          </span>
        </label>
        <p class="field-hint" id="swap-balance"></p>

        <label class="field">
          <span class="field-label">To</span>
          <span class="chip">
            <svg class="icon" aria-hidden="true"><use href="#i-logo" /></svg>
            LCAI · Lightchain AI on Ethereum
          </span>
        </label>
        <p class="field-hint" id="swap-receive-line">Enter an amount for a live quote.</p>

        <label class="field">
          <span class="field-label">Slippage tolerance</span>
          <select class="input" id="swap-slippage">
            <option value="10">0.1%</option>
            <option value="50" selected>0.5%</option>
            <option value="100">1.0%</option>
          </select>
        </label>

        <div class="alert" data-tone="error" role="alert" id="swap-error" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-alert" /></svg>
          <div class="alert-body">
            <strong class="alert-title">This cannot be swapped</strong>
            <span data-slot="detail"></span>
          </div>
        </div>

        <!-- What the worker actually quoted. Everything here comes from the
             chain rather than from the form above it. The pool's price moves,
             so a standing quote re-reads every five seconds — the figure on
             screen is never older than that. -->
        <section class="send-review" id="swap-review" hidden>
          <dl class="facts">
            <dt>You receive</dt>
            <dd id="swap-review-receive"></dd>
            <dt>At least, after slippage</dt>
            <dd id="swap-review-min"></dd>
            <dt>Pool</dt>
            <dd id="swap-review-pool"></dd>
            <dt>Most it can cost in fees</dt>
            <dd id="swap-review-fee"></dd>
            <dt>Network</dt>
            <dd><span class="chip" id="swap-review-network"></span></dd>
          </dl>
          <div class="send-warnings" id="swap-review-warnings"></div>
        </section>

        <!-- The outcome replaces the form rather than sitting under it: once
             money has moved, the inputs that moved it are done, and the only
             things left to do are look at the receipt or leave. -->
        <section class="send-review" id="swap-result" hidden>
          <dl class="facts">
            <dt>Swapped</dt>
            <dd id="swap-result-amount"></dd>
            <dt>Received</dt>
            <dd id="swap-result-received"></dd>
            <dt>Transaction</dt>
            <dd><code class="wallet-key" id="swap-result-hash"></code></dd>
          </dl>
          <div class="dialog-actions">
            <button class="button" type="button" id="swap-result-explorer">View on explorer</button>
            <button class="button button-primary" type="button" data-close="swap-dialog">
              Done
            </button>
          </div>
        </section>

        <div class="dialog-actions" id="swap-actions">
          <button class="button" type="button" data-close="swap-dialog">Cancel</button>
          <button class="button" type="button" id="swap-approve-btn" hidden>Approve first</button>
          <button class="button button-primary" type="button" id="swap-confirm-btn" hidden>
            Swap it
          </button>
        </div>
      </form>
    </dialog>
