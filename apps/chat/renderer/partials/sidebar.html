      <!-- One navigation, five zones, top to bottom:

           1. the brand, and whether this machine is talking to anybody
           2. the conversation list — the sidebar's whole body — with the two
              ways to start one pinned under the list header, so they are
              always in the same place and never scroll away or sit stranded
              mid-column
           3. elsewhere: Models, Account, Bridge, and the two ways to earn — visible, named, one
              press away
           4. who you are signed in as, which is also the way to Account
           5. version, theme, settings

           "Conversations" labels the room list and is nothing else. It was
           briefly both the label and a nav row, which put the same destination
           on screen twice and read as two navigation systems stapled together.
           No destination appears twice. -->
      <nav class="sidebar" id="sidebar" aria-label="Conversations">
        <!-- The brand lives in the top bar now, which spans the window rather
             than heading one column of it. What is left here is the fold-away
             control, kept where the hand already looks for it. -->
        <!-- The head is one row: the fold-away control, and the two facts worth
             stating before anything else — whether this machine is talking to
             anybody, and whether the wallet is open. They were three stacked
             rows and cost 58px of empty sidebar before the first conversation.
             The lock only appears when it applies. -->
        <div class="sidebar-head">
          <button
            class="icon-button sidebar-collapse"
            type="button"
            id="collapse-btn"
            title="Collapse the sidebar"
            aria-label="Collapse the sidebar"
            aria-expanded="true"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-collapse" /></svg>
          </button>

          <div class="sidebar-state">
            <span class="sidebar-status" id="status" role="status" data-state="busy">starting</span>
            <button class="sidebar-locked" type="button" id="sidebar-locked" hidden>
              <svg class="icon" aria-hidden="true"><use href="#i-lock" /></svg>
              <span>Wallet locked</span>
            </button>
          </div>
        </div>

        <!-- The list, its header, and the two ways to add to it. The actions
             are pinned between the header and the scrolling list: they used to
             float below the rooms, which put the primary action of a messenger
             at the mercy of how many rooms happened to be open. -->
        <div class="sidebar-rooms">
          <div class="sidebar-rooms-head">
            <span class="sidebar-rooms-title">Conversations</span>
          </div>
          <div class="sidebar-actions">
            <button class="button button-primary button-block" type="button" id="create-btn">
              <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
              <span class="nav-label">New conversation</span>
            </button>
            <button class="button button-block" type="button" id="join-btn">
              <svg class="icon" aria-hidden="true"><use href="#i-invite" /></svg>
              <span class="nav-label">Join with an invite</span>
            </button>
          </div>
          <div class="sidebar-body" id="chat-context">
            <ul class="room-list" id="room-list" aria-label="Your conversations"></ul>
            <p class="sidebar-empty" id="sidebar-empty">No conversations yet — start one.</p>
          </div>
        </div>

        <!-- Everything that is not a conversation, in the order the contract
             fixes. Visually separated from the list and below it, because the
             conversations are the reason the window is open — but visible and
             named, because these destinations were unreachable for a while
             behind an avatar with no affordance, and a destination nobody can
             find does not exist. -->
        <div class="sidebar-elsewhere">
          <p class="sidebar-group-title" aria-hidden="true">Elsewhere</p>
          <ul class="sections" aria-label="Elsewhere">
            <li>
              <button class="nav-item" type="button" data-section="models">
                <svg class="nav-icon" aria-hidden="true"><use href="#i-models" /></svg>
                <span class="nav-label">Models</span>
              </button>
            </li>
            <li>
              <button class="nav-item" type="button" data-section="wallet">
                <svg class="nav-icon" aria-hidden="true"><use href="#i-wallet" /></svg>
                <span class="nav-label">Account</span>
              </button>
            </li>
            <li>
              <button class="nav-item" type="button" data-section="bridge">
                <svg class="nav-icon" aria-hidden="true"><use href="#i-bridge" /></svg>
                <span class="nav-label">Bridge</span>
              </button>
            </li>
            <!-- Two ways to be paid by this network, and they are not
                 variations of one thing: a worker stakes 50,000 LCAI and
                 answers inference on a GPU, a validator stakes 500,000 and
                 attests blocks on the beacon chain. One page for both taught
                 people that the second was a mode of the first. -->
            <li>
              <button class="nav-item" type="button" data-section="worker">
                <svg class="nav-icon" aria-hidden="true"><use href="#i-worker" /></svg>
                <span class="nav-label">For Workers</span>
              </button>
            </li>
            <li>
              <button class="nav-item" type="button" data-section="validator">
                <svg class="nav-icon" aria-hidden="true"><use href="#i-shield" /></svg>
                <span class="nav-label">For Validators</span>
              </button>
            </li>
          </ul>
        </div>

        <div class="sidebar-foot">
          <!-- Who you are signed in as — identicon, truncated address, network
               — and a way to the account page. Not a menu: the destinations a
               menu here used to hide are the nav rows above, where they can be
               seen. -->
          <button class="account" type="button" id="account-btn" data-kit-focus>
            <span class="account-mark" id="account-mark" aria-hidden="true"></span>
            <span class="account-text">
              <span class="account-name" id="account-name">No wallet</span>
              <span class="account-role" id="account-role">Set one up</span>
            </span>
            <svg class="icon account-chevron" aria-hidden="true"><use href="#i-chevron" /></svg>
          </button>

          <!-- Still named for the bar it used to live in. wallet.js finds it by
               id and styles/settings.css by class, so renaming it is not a change
               this file can make on its own. -->
          <button
            class="account-balance"
            type="button"
            id="account-balance"
            title="Your wallet"
            data-kit-focus
            hidden
          ></button>

          <!-- Version, theme and settings: the two controls people look for in
               exactly this corner, and the build number under them. -->
          <div class="sidebar-tools">
            <!-- A button, not a label. It already said BETA and answered
                 support's first question; now it is also the way back to what
                 that means and where to report. -->
            <button class="version" type="button" id="version" data-kit-focus></button>
            <button
              class="icon-button"
              type="button"
              id="theme-btn"
              title="Switch theme"
              aria-label="Switch theme"
            >
              <svg class="icon" aria-hidden="true"><use href="#i-sun" /></svg>
            </button>
            <button
              class="icon-button"
              type="button"
              id="settings-btn"
              title="Settings"
              aria-label="Settings"
            >
              <svg class="icon" aria-hidden="true"><use href="#i-settings" /></svg>
            </button>
          </div>
        </div>
      </nav>
