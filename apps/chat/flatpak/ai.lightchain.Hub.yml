# Flatpak manifest — the supported self-build path, not a store channel.
#
# Nothing is published to Flathub: an install managed by a store cannot receive
# the peer-to-peer updates this application is built around, and the user would
# never see that that is what happened. See docs/decisions/0007-flatpak-snap.md.
# What this manifest is for is someone who wants the sandbox anyway and builds
# it locally; README.md in this directory gives the exact commands.
#
# The archive URLs and hashes below still point nowhere on purpose: there is no
# release host yet, and a build must fail loudly here rather than fetch
# something unexpected. A local build swaps the archive source for a file
# source, as the README describes.
id: ai.lightchain.Hub
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: lightchain # entrypoint.sh, installed below as /app/bin/lightchain
separate-locales: false
finish-args:
  # Rooms and inference both need the network; the rest is what an Electron
  # window needs to draw itself. Nothing here reaches the host filesystem.
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: lightchain
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 ${FLATPAK_ID}.png -t /app/share/icons/hicolor/128x128/apps/
      - install -Dm755 entrypoint.sh /app/bin/lightchain
      - mkdir -p /app/lib/${FLATPAK_ID}
      # The archive holds the forge package output with its top-level
      # directory intact (strip-components: 0), e.g. LightchainChat-linux-x64/.
      - cp -r ./LightchainChat-*/* /app/lib/${FLATPAK_ID}
    sources:
      - type: archive
        url: https://REPLACE-WITH-RELEASE-HOST/lightchain_0.1.0_arm64_flatpak.tar.gz
        only-arches:
          - aarch64
        strip-components: 0
        sha512: REPLACE-WITH-SHA512
      - type: archive
        url: https://REPLACE-WITH-RELEASE-HOST/lightchain_0.1.0_x64_flatpak.tar.gz
        only-arches:
          - x86_64
        strip-components: 0
        sha512: REPLACE-WITH-SHA512
      - type: file
        path: ai.lightchain.Hub.metainfo.xml
      - type: file
        path: ai.lightchain.Hub.desktop
      - type: file
        path: ai.lightchain.Hub.png
      - type: file
        path: entrypoint.sh
